<body>
<main class="app">
  <section id="titleScreen" class="screen title active">
    <div class="sun"></div>
    <nav class="language-panel" aria-label="Language">
      <button class="language-choice" data-language="en">EN</button>
      <button class="language-choice" data-language="ja">日本語</button>
      <button class="language-choice" data-language="es">ES</button>
      <button class="language-choice" data-language="zh">中文</button>
      <button class="language-choice" data-language="ko">한국어</button>
    </nav>
    <div class="title-card">
      <div class="crest">☀</div>
      <h1>AMATERASU<br>LEARNING RUNNER</h1>
      <p id="titleRule" class="title-rule">JUMP WHEN SOUND = KANA</p>
      <button id="startBtn" class="primary">START</button>
      <div id="titleControl" class="title-control">TAP / SPACE</div>
    </div>
  </section>

  <section id="gameScreen" class="screen game">
    <div id="world" class="world">
      <canvas id="canvas" aria-label="Game screen"></canvas>
      <div class="hud">
        <div class="hud-row">
          <div id="heartHud" class="chip hearts">♥ ♥ ♥</div>
          <div id="comboHud" class="chip"><small>COMBO</small>0</div>
          <div id="distanceHud" class="chip"><small>DIST</small>0</div>
        </div>
        <div id="stageHud" class="stage-chip">STAGE 1・SHRINE</div>
      </div>
      <button id="muteBtn" class="mute" aria-label="Sound">🔊</button>
      <div id="status" class="status">LISTEN…</div>
      <div id="count" class="count">—</div>
      <div id="flash" class="flash"></div>
    </div>
    <div class="question">
      <div class="question-card">
        <div id="kana" class="kana">—</div>
        <div class="instruction"><b id="instructionTitle">SOUND = KANA?</b><span id="instructionBody">MATCH: JUMP<br>DIFFERENT: STAY</span></div>
        <button id="replayBtn" class="replay" disabled aria-label="Replay sound">↻</button>
      </div>
      <button id="jumpBtn" class="jump" disabled>JUMP</button>
    </div>
  </section>

  <section id="resultScreen" class="screen result">
    <div class="result-card">
      <div class="crest">☀</div><p id="resultEyebrow" class="eyebrow">LEARNING RESULT</p><h2 id="resultTitle">RUN RESULT</h2>
      <p id="resultMessage" class="result-sub">GOOD RUN!</p>
      <div class="stats">
        <div class="stat"><small id="scoreLabel">SCORE</small><strong id="resultScore">0</strong></div>
        <div class="stat"><small id="distanceLabel">DISTANCE</small><strong id="resultDistance">0</strong></div>
        <div class="stat"><small id="maxComboLabel">MAX COMBO</small><strong id="resultCombo">0</strong></div>
        <div class="stat"><small id="accuracyLabel">ACCURACY</small><strong id="resultAccuracy">0%</strong></div>
      </div>
      <div class="learned"><h3><span id="practicedLabel">PRACTICED KANA</span> <span id="resultAnswered"></span></h3><div id="kanaList" class="kana-list"></div></div>
      <p id="learningTip" class="tip"></p>
      <button id="retryBtn" class="primary">RUN AGAIN</button>
      <button id="titleBtn" class="secondary">TITLE</button>
    </div>
  </section>
</main>

    }
    const px=playerScreenX(),py=Math.max(38,ground-31+state.playerY);if(p.aura){ctx.shadowColor=p.aura;ctx.shadowBlur=28;ctx.fillStyle=p.aura+'55';ctx.beginPath();ctx.arc(px,py,45+Math.sin(state.phaseT*8)*4,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
    const now=performance.now();
    if(state.characterAnim&&now>=state.characterAnim.end)state.characterAnim=null;
    const anim=state.characterAnim;
    let form=characterForm(),frame;
    if(anim?.type==='power'){
      const progress=(now-anim.start)/(anim.end-anim.start);
      form=progress<.52?anim.from:anim.to;
      frame=progress<.52?CHARACTER_FRAMES.powerUp:CHARACTER_FRAMES.powerEnd;
    }else if(anim?.type==='hit'){
      form=anim.form;frame=CHARACTER_FRAMES.hit;
    }else if(anim?.type==='fall'){
      form=anim.form;frame=CHARACTER_FRAMES.fall;
    }else if(anim?.type==='defeated'){
      form=anim.form;frame=CHARACTER_FRAMES.defeated;
    }else if(anim?.type==='land'){
      frame=CHARACTER_FRAMES.land;
    }else if(state.playerY<-3){
      frame=CHARACTER_FRAMES.jump;
    }else if(state.phase==='idle'){
      frame=CHARACTER_FRAMES.stand;
    }else{
      frame=CHARACTER_FRAMES.walk[Math.floor(state.scroll/18)%CHARACTER_FRAMES.walk.length];
    }
    const sprite=characterSprites[form];
    if(sprite){
      const size=Math.max(52,Math.min(126,W*.32,H*.48));
      const drawY=Math.max(2,ground-size+8+state.playerY);
      try{
        ctx.drawImage(sprite,frame*256,0,256,256,px-size*.5,drawY,size,size);
      }catch(_){
        // Keep the player visible even if an image frame cannot be decoded.
        drawFallbackCharacter(px,py,p);
      }
    }else{
      // Lightweight fallback shown only while the external sprite is loading.
      drawFallbackCharacter(px,py,p);
    }
    state.particles=state.particles.filter(a=>{a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=330*dt;if(a.life<=0)return false;ctx.globalAlpha=a.life;ctx.fillStyle=a.color;ctx.fillRect(a.x,a.y,5,5);ctx.globalAlpha=1;return true});ctx.restore()}
  function loop(now){if(!state.running)return;const dt=Math.min((now-state.last)/1000,.04);state.last=now;state.phaseT+=dt;const p=power();state.distance+=p.speed*dt*.34;state.scroll+=p.speed*dt;state.playerV+=1450*dt;state.playerY+=state.playerV*dt;const jumpCeiling=-Math.max(34,H*.32);if(state.playerY<jumpCeiling){state.playerY=jumpCeiling;if(state.playerV<0)state.playerV=0}if(state.playerY>=0){state.playerY=0;state.playerV=0;if(state.wasAirborne){state.wasAirborne=false;if(!state.characterAnim)setCharacterAnimation('land',260)}}drawWorld(dt);updateHud();raf=requestAnimationFrame(loop)}

  document.querySelectorAll('.language-choice').forEach(button=>button.addEventListener('click',()=>applyTitleLanguage(button.dataset.language)));
  $('startBtn').addEventListener('click',startRun);$('retryBtn').addEventListener('click',startRun);$('titleBtn').addEventListener('click',()=>{show('title')});ui.jump.addEventListener('click',toggleReady);ui.canvas.addEventListener('pointerdown',toggleReady);ui.replay.addEventListener('click',()=>state.question&&state.accepting&&speak(state.question.audio));ui.mute.addEventListener('click',()=>{state.muted=!state.muted;ui.mute.textContent=state.muted?'🔇':'🔊';if(state.muted){state.voiceSpeaking=false;if('speechSynthesis'in window)speechSynthesis.cancel();correctAudio.forEach(audio=>{audio.pause();audio.currentTime=0})}});window.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();toggleReady()}});document.addEventListener('visibilitychange',()=>{if(document.hidden){state.voiceSpeaking=false;if('speechSynthesis'in window)speechSynthesis.cancel();correctAudio.forEach(audio=>audio.pause())}});
})();
</script>
